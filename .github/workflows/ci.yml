name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install library dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test library
        run: npm run test

      - name: Typecheck library
        run: npm run typecheck

      - name: Build library
        run: npm run build

      - name: Check npm package contents
        run: npm run pack:check

      - name: Pack npm package
        run: |
          mkdir -p .package-test
          npm pack --pack-destination .package-test

      - name: Install minimal consumer dependencies
        run: npm install --prefix examples/minimal-consumer --no-audit --no-fund

      - name: Install packed WidgetForge in minimal consumer
        run: npm install --prefix examples/minimal-consumer --no-audit --no-fund --no-save "$GITHUB_WORKSPACE/.package-test/widgetforge-0.1.0.tgz"

      - name: Typecheck minimal consumer
        run: npm run typecheck --prefix examples/minimal-consumer

      - name: Build minimal consumer
        run: npm run build --prefix examples/minimal-consumer

      - name: Install playground dependencies
        run: npm install --prefix playground --no-audit --no-fund

      - name: Test playground
        run: npm run test --prefix playground

      - name: Build playground
        run: npm run build --prefix playground

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright UX acceptance
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-ux-acceptance
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
